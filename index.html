<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학회비 지출 신청서</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #cfcfcf;
      --sheet: #fff;
      --desk: #e6e6e4;
      --seal: #8f1d1d;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background: var(--desk);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    input, select, textarea {
      width: 100%;
      border: 1px solid #bdbdbd;
      background: #fff;
      border-radius: 0;
      padding: 7px 8px;
    }
    input:focus, select:focus, textarea:focus {
      outline: 1px solid var(--ink);
      border-color: var(--ink);
    }

    header.top {
      background: var(--sheet);
      border-bottom: 3px solid var(--ink);
    }
    .bar {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
    }
    .eyebrow {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 12px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .primary, .ghost, .file {
      border-radius: 0;
      padding: 8px 12px;
      border: 1px solid #222;
      background: #fff;
    }
    .primary { background: var(--seal); border-color: var(--seal); color: #fff; }
    .primary:hover { background: #731616; }
    .primary:disabled { background: #b9b9b9; border-color: #b9b9b9; cursor: not-allowed; }
    .ghost:hover, .file:hover { background: #f3f3f3; }
    .file { position: relative; overflow: hidden; }
    .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; border: 0; }

    .wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 40px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
      gap: 16px;
      align-items: start;
    }
    .layout > * { min-width: 0; }
    .card {
      background: var(--sheet);
      border: 1px solid #bdbdbd;
      border-radius: 0;
      padding: 14px;
    }
    .card h2 {
      margin: 0 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--ink);
      font-size: 14px;
      font-weight: 700;
    }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    label.block span, .field span, .line span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    textarea { min-height: 78px; resize: vertical; line-height: 1.5; }
    .span-2 { grid-column: span 2; }
    .signs-edit {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .sign-card {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .sign-card img {
      width: 84px;
      height: 56px;
      object-fit: contain;
      flex: none;
      background: #fff;
      border: 1px solid var(--line);
    }
    .sign-fields { flex: 1; min-width: 0; }
    .sign-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
    .sign-actions .file, .sign-actions .ghost { padding: 6px 10px; font-size: 13px; }
    .stamp-size { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

    .item-head, .item {
      display: grid;
      grid-template-columns: 28px 1.5fr 0.9fr 0.55fr 0.55fr 0.8fr auto;
      gap: 8px;
      align-items: end;
    }
    .item-head {
      margin: 8px 0 0;
      padding: 6px 8px;
      color: var(--ink);
      font-size: 12px;
      background: #f3f3f3;
      border: 1px solid var(--line);
      border-bottom: 0;
    }
    .items { display: flex; flex-direction: column; border: 1px solid var(--line); }
    .item {
      padding: 8px;
      background: #fff;
      border: 0;
      border-top: 1px solid var(--line);
    }
    .item:first-child { border-top: 0; }
    .idx {
      height: 36px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .line {
      background: transparent;
      padding: 6px 0 0;
      min-height: 54px;
    }
    .line strong, #totalMoney, .num { font-variant-numeric: tabular-nums; }
    .line strong { font-size: 15px; }
    @media (min-width: 721px) {
      .field span, .line span {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
      .line { min-height: 0; display: flex; align-items: center; height: 34px; padding: 0; }
    }
    .remove { padding: 7px 8px; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .receipt-box { margin: 14px 0; }
    .receipt-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .receipt-thumb { position: relative; width: 88px; height: 88px; border: 1px solid var(--line); background: #fff; }
    .receipt-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .receipt-thumb button { position: absolute; top: 0; right: 0; padding: 0 5px; line-height: 18px; }
    .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; }
    .shots img { width: 100%; height: 88px; object-fit: contain; border: 1px solid #ccc; background: #fff; }
    .fee-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 4px 8px;
      border: 1px solid #222;
      background: white;
      cursor: pointer;
      user-select: none;
    }
    .fee-toggle input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }
    .summary {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-top: 14px;
      padding: 10px 2px 0;
      border-top: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
    }
    #totalKorean { line-height: 1.45; }
    #totalMoney { font-size: 22px; font-weight: 700; white-space: nowrap; }
    #error { min-height: 1.2em; margin: 10px 0 0; color: var(--seal); }
    #status { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .hint { margin: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .preview-card { position: sticky; top: 16px; }
    #preview { max-height: calc(100vh - 48px); overflow: auto; }
    .paper {
      background: white;
      color: #1b1b1b;
      border: 1px solid #d9d9d9;
      padding: 18px 16px 22px;
      font-size: 12px;
      line-height: 1.45;
    }
    .paper-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      border: 1px solid #222;
      min-height: 64px;
      align-items: stretch;
    }
    .paper-head > div, .paper-head h2 {
      display: grid;
      place-items: center;
      margin: 0;
      border-right: 1px solid #222;
      text-align: center;
    }
    .paper-head h2 { font-size: 16px; letter-spacing: 0.04em; padding: 6px; line-height: 1.3; }
    .paper-head > div:first-child { font-size: 12px; line-height: 1.35; padding: 6px 8px; white-space: nowrap; }
    .signs { display: grid; grid-template-columns: repeat(3, auto); border-right: 0 !important; }
    .signs span { display: grid; place-items: center; border-left: 1px solid #222; padding: 6px 5px; font-size: 11px; line-height: 1.3; text-align: center; white-space: nowrap; }
    .amount { font-size: 13px; }
    .amount strong { font-weight: 700; }
    .reason, .lines, .slip { width: 100%; border-collapse: collapse; }
    .reason th, .slip th {
      width: 108px;
      border: 1px solid #222;
      background: #f7f7f7;
      font-weight: 600;
      white-space: nowrap;
    }
    .reason td, .slip td, .lines td, .lines th { border: 1px solid #222; padding: 5px 6px; }
    .lines th { background: #f3f3f3; font-weight: 600; }
    .lines td:first-child, .lines th:first-child { white-space: nowrap; }
    .num { text-align: right; }
    .sum { background: #f3f3f3; font-weight: 700; }
    .note, .date-line, .who { margin: 8px 0; }
    .who img { height: 32px; vertical-align: middle; margin-left: 6px; }
    .date-line, .who { text-align: right; }
    .muted { color: #888; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .preview-card { position: static; }
      .bar { flex-direction: column; align-items: flex-start; }
      .actions { justify-content: flex-start; }
      h1 { font-size: 20px; }
      .summary { flex-direction: column; align-items: flex-start; gap: 2px; }
      #preview { max-height: none; }
      .paper { min-width: 520px; }
    }
    @media (max-width: 720px) {
      .meta, .signs-edit { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .item-head { display: none; }
      .item {
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-areas:
          "name name name"
          "price qty unit"
          "line line line"
          "remove remove remove";
      }
      .idx { display: none; }
      .item label:nth-of-type(1) { grid-area: name; }
      .item label:nth-of-type(2) { grid-area: price; }
      .item label:nth-of-type(3) { grid-area: qty; }
      .item label:nth-of-type(4) { grid-area: unit; }
      .line { grid-area: line; }
      .remove { grid-area: remove; justify-self: start; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="bar">
      <div>
        <p class="eyebrow">철도시스템학부</p>
        <h1>학회비 지출 신청서</h1>
      </div>
      <div class="actions">
        <button id="sampleBtn" class="ghost" type="button">화면 예시로 채우기</button>
        <button id="resetBtn" class="ghost" type="button">지우기</button>
        <button id="saveBtn" class="primary" type="button">HWPX 저장</button>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="layout">
      <section class="card">
        <h2>입력</h2>
        <div class="meta">
          <label class="block"><span>지출 예상 일자</span><input id="expectDate" type="date"></label>
          <label class="block"><span>작성 일자</span><input id="writeDate" type="date"></label>
          <label class="block"><span>집행</span>
            <select id="timing">
              <option value="after">사후집행</option>
              <option value="before">사전집행</option>
            </select>
          </label>
          <label class="block"><span>영수증 매수</span><input id="receiptCount" type="number" min="1" step="1"></label>
          <label class="block span-2"><span>영수증 지출항목</span><input id="subject" type="text"></label>
          <label class="block span-2"><span>지출 사유</span><textarea id="reason"></textarea></label>
        </div>
        <div class="signs-edit">
          <div class="sign-card">
            <img id="accountantImg" alt="회계담당 도장" src="회계담당.png">
            <div class="sign-fields">
              <label class="block"><span>회계담당</span><input id="accountant" type="text" maxlength="12" autocomplete="name"></label>
              <div class="sign-actions">
                <label class="file">도장 바꾸기<input id="accountantStamp" type="file" accept="image/png,.png,image/*"></label>
                <span class="stamp-size">640×280</span>
                <button id="accountantStampReset" class="ghost" type="button" hidden>기본 도장</button>
              </div>
            </div>
          </div>
          <div class="sign-card">
            <img id="presidentImg" alt="학생회장 도장" src="학생회장.png">
            <div class="sign-fields">
              <label class="block"><span>학생회장</span><input id="president" type="text" maxlength="12" autocomplete="name"></label>
              <div class="sign-actions">
                <label class="file">도장 바꾸기<input id="presidentStamp" type="file" accept="image/png,.png,image/*"></label>
                <span class="stamp-size">640×280</span>
                <button id="presidentStampReset" class="ghost" type="button" hidden>기본 도장</button>
              </div>
            </div>
          </div>
        </div>
        <div class="receipt-box">
          <div class="toolbar-actions">
            <label class="file">영수증 올리기<input id="receiptInput" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" multiple></label>
            <button id="recognizeBtn" class="ghost" type="button">영수증 인식</button>
          </div>
          <div id="receiptList" class="receipt-list"></div>
        </div>

        <div class="item-head" aria-hidden="true">
          <span></span><span>품목</span><span>단가</span><span>수량</span><span>단위</span><span>합계</span><span></span>
        </div>
        <div id="items" class="items"></div>
        <div class="toolbar">
          <div class="toolbar-actions">
            <button id="addRow" class="ghost" type="button">행 추가</button>
            <label class="fee-toggle">
              <input id="feeToggle" type="checkbox">
              <span>이체수수료 600원 · 1EA</span>
            </label>
          </div>
          <span class="hint" style="margin:0">마지막 품목에서 Enter누르면 행 추가.</span>
        </div>

        <div class="summary">
          <div>
            <div id="totalKorean">일금 영 원정</div>
          </div>
          <div id="totalMoney">0원</div>
        </div>
        <p id="error" role="alert"></p>
        <p id="status"></p>
      </section>

      <aside class="card preview-card">
        <h2>문서 미리보기</h2>
        <div id="preview"></div>
      </aside>
    </div>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="js/template.js"></script>
  <script src="js/hwpx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
